{% extends "base.html" %}
{% block title %}Forgot Password - Skill Swap{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="auth-header">
        <svg class="swap-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 12 H24 M24 12 L19 7 M24 12 L19 17"/><path d="M26 20 H8 M8 20 L13 25 M8 20 L13 15"/></svg>
    </div>
    <h2>Forgot your password?</h2>
    <p class="auth-sub">We'll email you a reset link.</p>
    <form method="POST">
        <label>Email</label>
        <input type="email" name="email" required>
        <button type="submit" class="btn" style="width:100%">Send reset link</button>
    </form>
</div>
{% endblock %}
