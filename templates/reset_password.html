{% extends "base.html" %}
{% block title %}Reset Password - Skill Swap{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="auth-header">
        <svg class="swap-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 12 H24 M24 12 L19 7 M24 12 L19 17"/><path d="M26 20 H8 M8 20 L13 25 M8 20 L13 15"/></svg>
    </div>
    <h2>Set a new password</h2>
    <form method="POST">
        <label>New password</label>
        <input type="password" name="password" required>
        <button type="submit" class="btn" style="width:100%">Reset password</button>
    </form>
</div>
{% endblock %}
